<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="45%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1f3b2c"/>
      <stop offset="0.65" stop-color="#10201a"/>
      <stop offset="1" stop-color="#070d0a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.5" stop-color="#d4a640"/>
      <stop offset="1" stop-color="#7a5a1c"/>
    </linearGradient>
    <radialGradient id="slot" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2d6b45"/>
      <stop offset="1" stop-color="#0d2418"/>
    </radialGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ffd9"/>
      <stop offset="0.5" stop-color="#5ef08a"/>
      <stop offset="1" stop-color="#1fae55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="400" height="400" rx="64" fill="url(#bg)"/>

  <!-- action button -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="220" height="220" rx="22" fill="url(#gold)"/>
    <rect x="96" y="96" width="188" height="188" rx="12" fill="url(#slot)" stroke="#3b2a0c" stroke-width="3"/>
  </g>

  <!-- heal cross -->
  <path d="M168 128 H212 V168 H252 V212 H212 V252 H168 V212 H128 V168 H168 Z" fill="#5ef08a" filter="url(#glow)" opacity="0.8"/>
  <path d="M168 128 H212 V168 H252 V212 H212 V252 H168 V212 H128 V168 H168 Z" fill="url(#cross)" stroke="#0e5a2a" stroke-width="4" stroke-linejoin="round"/>

  <!-- @ macro label -->
  <text x="108" y="128" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="34" fill="#fbe7a1" stroke="#1a1206" stroke-width="2" paint-order="stroke">@</text>

  <!-- gear badge (auto) -->
  <g transform="translate(286 102)" filter="url(#shadow)">
    <g fill="url(#gold)" stroke="#3b2a0c" stroke-width="3" stroke-linejoin="round">
      <path d="M-8 -40 H8 L10 -30 L19 -26 L28 -33 L39 -22 L32 -13 L36 -4 L46 -2 V14 L36 16 L32 25 L39 34 L28 45 L19 38 L10 42 L8 52 H-8 L-10 42 L-19 38 L-28 45 L-39 34 L-32 25 L-36 16 L-46 14 V-2 L-36 -4 L-32 -13 L-39 -22 L-28 -33 L-19 -26 L-10 -30 Z" transform="translate(0 -6)"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#10201a" stroke="#3b2a0c" stroke-width="3"/>
  </g>

  <!-- mouseover cursor -->
  <g transform="translate(246 236) rotate(-8)" filter="url(#shadow)">
    <path d="M0 0 L0 92 L22 72 L38 108 L56 100 L40 64 L70 62 Z" fill="#ffffff" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
